name: Build on request
on: [workflow_dispatch]

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Setup MSBuild and add to PATH
      uses: microsoft/setup-msbuild@v2
      id: setup_msbuild

    - name: Setup vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg.git ${{ runner.workspace }}\vcpkg
        cd ${{ runner.workspace }}\vcpkg
        git checkout 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
        .\bootstrap-vcpkg.bat

    - name: Provide 7zip to vcpkg
      shell: powershell
      run: |
        # The old vcpkg tries to download 7zip 21.07 from a URL that no longer exists.
        # Provide the system 7-zip (already on the runner) where vcpkg expects it.
        $toolPaths = @(
          "${{ runner.workspace }}\vcpkg\downloads\tools\7zip\21.07",
          "${{ runner.workspace }}\vcpkg\downloads\tools\7z-21.7.0-windows",
          "${{ runner.workspace }}\vcpkg\downloads\tools\7zip-21.7.0-windows"
        )
        foreach ($p in $toolPaths) {
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "$p\7za.exe" -Force
          Copy-Item "C:\Program Files\7-Zip\7z.dll" "$p\7z.dll" -Force
        }

    - name: Install vcpkg packages
      shell: cmd
      run: |
        ${{ runner.workspace }}\vcpkg\vcpkg install --recurse --triplet x86-windows-static --clean-after-build boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl
        if %errorlevel% neq 0 exit /b %errorlevel%

    - name: Verify boost headers exist
      shell: powershell
      run: |
        $headerPath = "${{ runner.workspace }}\vcpkg\installed\x86-windows-static\include\boost\asio\io_service.hpp"
        if (Test-Path $headerPath) {
          Write-Host "boost headers found OK"
        } else {
          Write-Host "ERROR: boost headers not found at $headerPath"
          Get-ChildItem "${{ runner.workspace }}\vcpkg\installed\" -Recurse -Depth 2 | Select-Object FullName
          exit 1
        }

    - name: Integrate vcpkg
      run: |
        ${{ runner.workspace }}\vcpkg\vcpkg integrate install

    - name: Compile otclient_dx
      timeout-minutes: 20
      run: |
        cd vc16
        MSBuild /property:Configuration=DirectX /p:BUILD_REVISION=${{github.run_number}}

    - name: Compile otclient_gl
      timeout-minutes: 20
      run: |
        cd vc16
        MSBuild /property:Configuration=OpenGL /p:BUILD_REVISION=${{github.run_number}}

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: Download-binaries
        path: |
          otclient_gl.exe
          otclient_dx.exe
        if-no-files-found: error
