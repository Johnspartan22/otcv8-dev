name: Build on request
on: [workflow_dispatch]

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Setup MSBuild and add to PATH
      uses: microsoft/setup-msbuild@v2
      id: setup_msbuild

    - name: Setup vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg.git ${{ runner.workspace }}\vcpkg
        cd ${{ runner.workspace }}\vcpkg
        git checkout 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
        .\bootstrap-vcpkg.bat

    - name: Patch vcpkg for dead URLs
      shell: powershell
      run: |
        $vcpkgDir = "${{ runner.workspace }}\vcpkg"

        # Fix 1: 7-zip.org URLs are dead - use SourceForge mirror
        $xml = "$vcpkgDir\scripts\vcpkgTools.xml"
        (Get-Content $xml) -replace 'https://www.7-zip.org/a/', 'https://downloads.sourceforge.net/project/sevenzip/7-Zip/21.07/' | Set-Content $xml

        # Fix 2: MSYS2 package URLs are dead - disable vcpkg_fixup_pkgconfig entirely
        # (OTCv8 uses MSBuild/vcpkg integration, not pkg-config)
        $pkgconfig = "$vcpkgDir\scripts\cmake\vcpkg_fixup_pkgconfig.cmake"
        $content = Get-Content $pkgconfig -Raw
        $content = $content -replace '(function\(vcpkg_fixup_pkgconfig\))', "`$1`nreturn()"
        Set-Content $pkgconfig -Value $content

        Write-Host "Patched vcpkgTools.xml and disabled vcpkg_fixup_pkgconfig"

    - name: Install vcpkg packages
      shell: cmd
      run: |
        ${{ runner.workspace }}\vcpkg\vcpkg install --recurse --triplet x86-windows-static --clean-after-build boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl
        if %errorlevel% neq 0 exit /b %errorlevel%

    - name: Verify boost headers
      shell: powershell
      run: |
        $h = "${{ runner.workspace }}\vcpkg\installed\x86-windows-static\include\boost\asio\io_service.hpp"
        if (Test-Path $h) { Write-Host "OK: boost headers found" }
        else { Write-Host "FAIL: headers missing"; exit 1 }

    - name: Integrate vcpkg
      run: ${{ runner.workspace }}\vcpkg\vcpkg integrate install

    - name: Compile otclient_dx
      timeout-minutes: 20
      run: |
        cd vc16
        MSBuild /property:Configuration=DirectX /p:BUILD_REVISION=${{github.run_number}}

    - name: Compile otclient_gl
      timeout-minutes: 20
      run: |
        cd vc16
        MSBuild /property:Configuration=OpenGL /p:BUILD_REVISION=${{github.run_number}}

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: Download-binaries
        path: |
          otclient_gl.exe
          otclient_dx.exe
        if-no-files-found: error
